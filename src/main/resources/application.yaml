spring:
  application:
    name: demo
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/demo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  
jwt:
  signerKey: "9j8FvKmXz1WbQ2dE5hT6Y7uI8oKpL0mN1aBsCdEfGhI=abcdefghijklmnopqrstuvwxyz123456"
  #Thiết lập thời gian của JWT tùy thuộc vào hệ thống
  valid-duration: 3600 # in second
  refreshable-duration: 36000 #in second